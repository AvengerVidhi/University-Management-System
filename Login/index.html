
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #b5c8e5;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0969da;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #064fa5;
        }

        #message {
            color: green;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>University Login</h2>

        <form onsubmit="login(event)">
            <input type="text" id="username"
                   placeholder="Enter Username" required>

            <input type="password" id="password"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value;

            document.getElementById("message").innerText =
                "Welcome, " + username + "! Login demo successful.";
        }
    </script>

</body>
</html>
